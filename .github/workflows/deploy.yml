name: Validate production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - run: npm run validate:seo
      - run: npm run validate:dist
      - run: npm run audit:high
