[build]
  command = "npm run ci"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[context.deploy-preview]
  command = "npm run ci"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
